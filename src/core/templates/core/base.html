<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Biblioteca{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            line-height: 1.6;
            background: #faf7f2;
            color: #2c2824;
        }
        .navbar {
            background: #5a3e2b;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .navbar .brand {
            color: #f4e9d7;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
        }
        .navbar nav { display: flex; gap: 1.2rem; }
        .navbar a { color: #f4e9d7; text-decoration: none; }
        .navbar a:hover { color: #e0c9a0; }
        .main { max-width: 900px; margin: 0 auto; padding: 2rem; }
        .header { text-align: center; padding: 2rem 0 1rem; }
        .header h1 { color: #5a3e2b; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        th, td { padding: 0.7rem 1rem; text-align: left; border-bottom: 1px solid #e8e0d5; }
        th { background: #5a3e2b; color: #f4e9d7; }
        tr:nth-child(even) { background: #f6f1e8; }
        .button {
            display: inline-block;
            padding: 0.8rem 1.6rem;
            background: #8a5a32;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
        }
        .button:hover { background: #6f4526; }
        .form-container {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            margin-top: 1rem;
            max-width: 520px;
        }
        .form-container label { display: block; margin: 0.75rem 0 0.25rem; font-weight: 600; }
        .form-container input, .form-container select, .form-container textarea {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 1px solid #cbb99d;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1rem;
        }
        .form-container input:focus { outline: none; border-color: #8a5a32; }
        .form-container .errorlist { color: #c0392b; list-style: none; padding: 0; margin: 0.25rem 0 0; font-size: 0.85rem; }
        .messages li { list-style: none; padding: 0.7rem 1rem; border-radius: 4px; margin-bottom: 0.5rem; }
        .messages .success { background: #e6f2e4; color: #2e6b2e; }
        .footer { text-align: center; padding: 2rem; color: #8a8580; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="navbar">
        <a class="brand" href="{% url 'core:home' %}">Biblioteca</a>
        <nav>
            <a href="{% url 'core:home' %}">Inicio</a>
            <a href="{% url 'library:list' %}">Catálogo</a>
            <a href="{% url 'admin:library_book_add' %}">Registrar libro</a>
            <a href="{% url 'movies:list' %}">Películas</a>
            <a href="{% url 'quiz:exam_list' %}">Quiz</a>
        </nav>
    </div>
    <div class="main">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
    <div class="footer">Proyecto Django - Biblioteca</div>
</body>
</html>
